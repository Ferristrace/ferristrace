name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ferrislabs/ferristrace

jobs:
  # The same stores as ci.yaml's test job: a tag runs the adapter suites for
  # real, and REQUIRE_* turns a store that is not there into a failure.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ferristrace
          POSTGRES_PASSWORD: ferristrace
          POSTGRES_DB: ferristrace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ferristrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_PASSWORD: ferristrace
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://ferristrace:ferristrace@localhost:5432/ferristrace
      REQUIRE_DATABASE_URL: "1"
      REDIS_URL: redis://localhost:6379
      REQUIRE_REDIS_URL: "1"
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ferristrace
      REQUIRE_CLICKHOUSE_URL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tag matches the version the workspace declares
        id: version
        run: |
          set -eu
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "//; s/"$//')
          test "${tagged%-rc.*}" = "$declared" || {
            echo "::error::the tag says ${tagged%-rc.*} and Cargo.toml says $declared"
            echo "Bump the workspace version in its own commit before tagging."
            exit 1
          }
          for field in version appVersion; do
            charted=$(awk -v f="$field:" '$1 == f {gsub(/"/, "", $2); print $2}' charts/ferristrace/Chart.yaml)
            test "$charted" = "$declared" || {
              echo "::error::Cargo.toml says $declared and the chart's $field says $charted"
              echo "Bump charts/ferristrace/Chart.yaml with the workspace."
              exit 1
            }
          done
          echo "version=${tagged}" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
        with:
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-test
          save-if: false
      - name: give ClickHouse a tiered storage policy
        env:
          CLICKHOUSE_CONTAINER: ${{ job.services.clickhouse.id }}
        run: |
          docker cp .github/clickhouse/tiered.xml "$CLICKHOUSE_CONTAINER":/etc/clickhouse-server/config.d/tiered.xml
          docker restart "$CLICKHOUSE_CONTAINER"
          for _ in $(seq 60); do
            curl -sf http://localhost:8123/ping && exit 0
            sleep 1
          done
          echo "ClickHouse did not come back after the restart" >&2
          exit 1
      - name: the tag is formatted, lint-clean and green
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo test --doc --workspace --locked

  images:
    needs: check
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker.yaml
    with:
      push: true

  chart:
    needs: [check, images]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/helm.yaml
    with:
      version: ${{ needs.check.outputs.version }}

  release:
    needs: [images, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the changelog of this tag, from its commits
        id: cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --latest --strip header
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: measure what was published
        id: sizes
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          {
            echo "| Image | Platform | Compressed |"
            echo "| --- | --- | --- |"
          } > sizes.md
          for image in ferristrace ferristrace-mcp ferristrace-mcp-gateway; do
            ref="ghcr.io/ferrislabs/${image}:${version}"
            docker buildx imagetools inspect "$ref" --raw \
              | jq -r '.manifests[]? | select(.platform.os == "linux")
                       | select(.platform.architecture != "unknown")
                       | "\(.platform.architecture) \(.digest)"' \
              | while read -r arch digest; do
                  bytes=$(docker buildx imagetools inspect "${ref%:*}@${digest}" --raw \
                    | jq '[.layers[].size] | add')
                  mib=$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1048576 }')
                  echo "| \`${ref}\` | linux/${arch} | ${mib} MiB |" >> sizes.md
                done
          done
          cat sizes.md >> "$GITHUB_STEP_SUMMARY"
      - name: cut the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.cliff.outputs.content }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## Images"
            echo
            echo '```sh'
            echo "docker pull ${IMAGE}:${version}"
            echo '```'
            echo
            echo "The server, the MCP server and the MCP gateway, each for"
            echo "linux/amd64 and linux/arm64 with provenance attached."
            echo
            cat sizes.md
            echo
            echo "## Helm chart"
            echo
            echo '```sh'
            echo "helm install ferristrace oci://ghcr.io/ferrislabs/charts/ferristrace --version ${version}"
            echo '```'
          } > body.md
          echo >> body.md
          printf '%s\n' "$NOTES" >> body.md
          prerelease=""
          case "$version" in *-rc.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file body.md \
            $prerelease
